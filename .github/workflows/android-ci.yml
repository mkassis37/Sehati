name: Android CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify bundled offline Arabic OCR model
        run: |
          ACTUAL_BLOB_SHA=$(git hash-object app/src/main/assets/tessdata/ara.traineddata)
          test "$ACTUAL_BLOB_SHA" = "c8d129c67821c1592cac46836686b057ecc203dc" || \
            (echo "Arabic OCR model checksum mismatch" && exit 1)

      - name: Verify Android debug build
        run: gradle --no-daemon assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload unit test reports (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sehati-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Run Android lint
        if: always()
        run: gradle --no-daemon lintDebug

      - name: Build Android instrumentation APK
        run: gradle --no-daemon assembleDebugAndroidTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sehati-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package complete project and verified debug APK
        run: |
          set -euo pipefail
          bundle="sehati-project.zip"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$signer"
          "$signer" verify --verbose --print-certs "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$aapt"
          badging="$("$aapt" dump badging "$apk" | sed -n '1p')"
          test -n "$badging"
          source_id="$(git rev-parse HEAD)"
          grep -RF "SOURCE_COMMIT = \"$source_id\";" app/build/generated/source/buildConfig/debug
          printf '%s\n' "$badging"
          git archive --format=zip --prefix=Sehati/ -o "$bundle" HEAD
          staging="$(mktemp -d)"
          mkdir -p "$staging/Sehati/test-builds"
          cp "$apk" "$staging/Sehati/test-builds/sehati-debug.apk"
          sha="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          printf 'Commit: %s\nAPK: sehati-debug.apk\nBytes: %s\nSHA-256: %s\n' \
            "$(git rev-parse HEAD)" "$(stat -c %s "$apk")" "$sha" > "$staging/Sehati/test-builds/BUILD_INFO.txt"
          printf '%s\n' "$badging" >> "$staging/Sehati/test-builds/BUILD_INFO.txt"
          { printf '### Verified Debug APK\n\n'; cat "$staging/Sehati/test-builds/BUILD_INFO.txt"; } >> "$GITHUB_STEP_SUMMARY"
          (cd "$staging" && zip -q "$GITHUB_WORKSPACE/$bundle" Sehati/test-builds/*)
          unzip -tq "$bundle"

      - name: Upload complete Sehati project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sehati-project-zip
          path: sehati-project.zip
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Android device tests (API 35)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation on an Android emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sehati-instrumentation-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14
