name: Prepare permanent Android signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate protected release keystore
    runs-on: ubuntu-latest
    steps:
      - name: Validate existing password and alias secrets
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate permanent JKS and export safe setup files
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/sehati-release.jks"
          OUT="$RUNNER_TEMP/sehati-signing-bootstrap"
          mkdir -p "$OUT"

          keytool -genkeypair -v \
            -keystore "$STORE" \
            -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -keyalg RSA -keysize 3072 -sigalg SHA256withRSA \
            -validity 10000 \
            -dname "CN=Sehati Android Release, OU=Mobile, O=Sehati, L=Amman, ST=Amman, C=JO" \
            -noprompt

          keytool -list -v \
            -keystore "$STORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > "$OUT/certificate-fingerprint.txt"

          keytool -exportcert -rfc \
            -keystore "$STORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$OUT/sehati-release-certificate.pem"

          base64 -w 0 "$STORE" > "$OUT/ANDROID_KEYSTORE_BASE64.txt"
          printf '%s\n' \
            '1. Download this artifact from the successful workflow run.' \
            '2. Open ANDROID_KEYSTORE_BASE64.txt and copy its entire single-line content.' \
            '3. In repository Settings > Secrets and variables > Actions, edit ANDROID_KEYSTORE_BASE64 and paste that content.' \
            '4. Do not change the other three secrets; this key was generated using their current values.' \
            '5. Keep this artifact private. The JKS is password-protected, but the Base64 text is still sensitive.' \
            '6. Save the certificate SHA-1 from certificate-fingerprint.txt for the Google Android OAuth client.' \
            > "$OUT/README.txt"

          test -s "$OUT/ANDROID_KEYSTORE_BASE64.txt"
          test -s "$OUT/certificate-fingerprint.txt"

      - name: Upload one-time keystore setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sehati-signing-bootstrap-${{ github.run_number }}
          path: ${{ runner.temp }}/sehati-signing-bootstrap/
          if-no-files-found: error
          retention-days: 1
