name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify bundled offline Arabic OCR model
        run: |
          ACTUAL_BLOB_SHA=$(git hash-object app/src/main/assets/tessdata/ara.traineddata)
          test "$ACTUAL_BLOB_SHA" = "c8d129c67821c1592cac46836686b057ecc203dc" || \
            (echo "Arabic OCR model checksum mismatch" && exit 1)

      - name: Verify signing secrets exist
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sehati-release.jks"
          test -s "$RUNNER_TEMP/sehati-release.jks"

      - name: Build signed release APK and Android App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease bundleRelease \
            -PsehatiStoreFile="$RUNNER_TEMP/sehati-release.jks" \
            -PsehatiStorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PsehatiKeyAlias="$ANDROID_KEY_ALIAS" \
            -PsehatiKeyPassword="$ANDROID_KEY_PASSWORD" \
            -PsehatiGoogleDriveEnabled=true

      - name: Verify APK signature and 16 KB ZIP alignment
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"

      - name: Prepare build artifacts
        run: |
          mkdir -p release-assets
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/Sehati-${SAFE_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/Sehati-${SAFE_REF_NAME}.aab"
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
          VERSION_CODE=$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          VERSION_NAME=$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
          APK_NAME="Sehati-${SAFE_REF_NAME}.apk"
          APK_SHA256=$(sha256sum "release-assets/$APK_NAME" | awk '{print $1}')
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$APK_NAME"
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "apkUrl": "%s",\n  "sha256": "%s"\n}\n' "$VERSION_CODE" "$VERSION_NAME" "$APK_URL" "$APK_SHA256" > release-assets/update.json

      - name: Upload signed test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Sehati-signed-test-${{ github.run_number }}
          path: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: "صحتي ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release-assets/Sehati-${{ github.ref_name }}.apk
            release-assets/Sehati-${{ github.ref_name }}.aab
            release-assets/SHA256SUMS.txt
            release-assets/update.json
